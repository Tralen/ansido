name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc-version: "9.2.8"
          - os: ubuntu-latest
            ghc-version: "9.14.1"
          - os: macos-15-intel
            ghc-version: "9.2.8"
          - os: macos-15
            ghc-version: "9.14.1"
          - os: windows-latest
            ghc-version: "9.2.8"
          - os: windows-latest
            ghc-version: "9.14.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc-version }}
          cabal-version: "3.18.1.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - run: cabal update
      - run: cabal build all
      - run: cabal test all
      - run: cabal check
      - run: cabal haddock
      - run: cabal sdist

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Fourmolu
        run: |
          curl -sSL -o "$RUNNER_TEMP/fourmolu.zip" https://github.com/fourmolu/fourmolu/releases/download/v0.21.0.0/fourmolu-0.21.0.0-linux-x86_64.zip
          echo "aadf6931653df7b96f52014cf8eb4285a3e8778cd0b531499fc3ee013e1e00c7  $RUNNER_TEMP/fourmolu.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/fourmolu.zip" -d "$RUNNER_TEMP"
          install -Dm755 "$RUNNER_TEMP/fourmolu-0.21.0.0-linux-x86_64/fourmolu" "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: find src test app -name '*.hs' -print0 | xargs -0 fourmolu --mode check
