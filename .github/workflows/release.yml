name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.9.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"
          package_version="$(sed -n 's/^version:[[:space:]]*//p' ansido.cabal | head -1 | tr -d '[:space:]')"
          test "$version" = "$package_version"
      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - name: Update package index
        run: cabal update
      - name: Build and test
        run: |
          cabal build all --enable-tests -fwerror
          cabal test all -fwerror
          cabal check
          cabal sdist
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cabal list-bin exe:ansido)"
          architecture="$(uname -m)"
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp "$binary" dist/
          cp README.md LICENSE CHANGELOG.md dist/
          case "$RUNNER_OS" in
            Windows)
              mv "dist/$(basename "$binary")" dist/ansido.exe
              asset="ansido-${version}-windows-${architecture}.zip"
              (cd dist && 7z a "../${asset}" .)
              ;;
            macOS)
              chmod +x "dist/$(basename "$binary")"
              asset="ansido-${version}-macos-${architecture}.tar.gz"
              tar -czf "$asset" -C dist .
              ;;
            Linux)
              chmod +x "dist/$(basename "$binary")"
              asset="ansido-${version}-linux-${architecture}.tar.gz"
              tar -czf "$asset" -C dist .
              ;;
          esac
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "Created ${asset}"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.package.outputs.asset }}
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansido-${{ matrix.os }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
